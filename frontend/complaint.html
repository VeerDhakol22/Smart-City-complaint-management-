<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint - Smart City Complaint Management</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <div class="card">
        <div class="logo">📝</div>
        <h1>Submit Complaint</h1>
        <h2>Report a Civic Problem</h2>

        <form id="complaintForm" enctype="multipart/form-data">
            <input
                type="text"
                id="title"
                placeholder="Complaint Title (e.g. Street light not working)"
                required
            >

            <select id="category" required>
                <option value="">Select Category</option>
                <option value="Road">Road</option>
                <option value="Garbage">Garbage</option>
                <option value="Water">Water</option>
                <option value="Electricity">Electricity</option>
                <option value="Drainage">Drainage</option>
                <option value="Street Light">Street Light</option>
                <option value="Other">Other</option>
            </select>

            <select id="priority" required>
                <option value="">Select Priority</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>

            <textarea
                id="description"
                placeholder="Describe your complaint in detail..."
                rows="5"
                required
            ></textarea>

            <input
                type="text"
                id="location"
                placeholder="Enter Location / Landmark / Ward"
                required
            >

            <label class="file-label" style="display:block; text-align:left; margin-top:10px; font-weight:bold;">
                Complaint Photo (Optional, Max 5MB):
            </label>

            <input
                type="file"
                id="photo"
                accept="image/*"
            >

            <!-- Photo Preview -->
            <img
                id="photoPreview"
                alt="Selected Photo Preview"
                style="display:none; width:100%; max-height:220px; object-fit:cover; margin-top:10px; border-radius:6px; border:1px solid #ddd;"
            >

            <button type="submit" style="margin-top: 15px;">
                Submit Complaint
            </button>
        </form>

        <br>
        <a href="dashboard.html">
            ← Back to Dashboard
        </a>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/complaints.js"></script>
</body>
</html>
