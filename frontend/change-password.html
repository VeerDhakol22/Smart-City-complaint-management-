<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Smart City Complaint Management</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <div class="card">
        <div class="logo">🔐</div>
        <h1>Change Password</h1>
        <h2>Update Your Account Password</h2>

        <form id="passwordForm">
            <input
                type="password"
                id="oldPassword"
                placeholder="Current Password"
                required
            >
            <input
                type="password"
                id="newPassword"
                placeholder="New Password (min. 6 characters)"
                required
            >
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm New Password"
                required
            >
            <button type="submit">
                Update Password
            </button>
        </form>

        <br>
        <a href="profile.html">
            ← Back to Profile
        </a>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
